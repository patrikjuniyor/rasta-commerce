name: Theme quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install JavaScript tooling
        run: npm ci

      - name: Lint CSS and JavaScript
        run: npm run lint

      - name: Run static regression tests
        run: npm test

      - name: Lint PHP syntax
        run: npm run test:php

      - name: Build installable theme archive
        run: npm run package

      - name: Upload theme archive
        uses: actions/upload-artifact@v4
        with:
          name: rasta-commerce-theme
          path: release/rasta-commerce-*.zip
          if-no-files-found: error
