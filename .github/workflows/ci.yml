name: Theme quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install JavaScript tooling
        run: npm ci

      - name: Lint CSS and JavaScript
        run: npm run lint

      - name: Run static regression tests
        run: npm test

      - name: Lint PHP syntax
        run: npm run test:php

      - name: Run ZarinPal gateway contract tests
        run: npm run test:gateway

      - name: Run Jalali date contract tests
        run: npm run test:jalali

      - name: Run Elementor Core widget contract tests
        run: npm run test:elementor

      - name: Run admin dashboard contract tests
        run: npm run test:admin

      - name: Run customizer contract tests
        run: npm run test:customizer

      - name: Run maintenance mode contract tests
        run: npm run test:maintenance

      - name: Run store settings contract tests
        run: npm run test:store

      - name: Run order notification contract tests
        run: npm run test:notifications

      - name: Run welcome page contract tests
        run: npm run test:welcome

      - name: Run builder contract tests
        run: npm run test:builder

      - name: Build installable theme, child, core, and gateway archives
        run: npm run package

      - name: Build marketplace preparation package
        run: npm run marketplace:prepare

      - name: Upload installable archives
        uses: actions/upload-artifact@v7
        with:
          name: rasta-commerce-deliverables
          path: |
            release/*.zip
            marketplace/release/*.zip
          if-no-files-found: error
