name: Theme quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install JavaScript tooling
        run: npm ci

      - name: Lint CSS and JavaScript
        run: npm run lint

      - name: Run static regression tests
        run: npm test

      - name: Lint PHP syntax
        run: npm run test:php

      - name: Run ZarinPal gateway contract tests
        run: npm run test:gateway

      - name: Build installable theme and gateway archives
        run: npm run package

      - name: Upload installable archives
        uses: actions/upload-artifact@v7
        with:
          name: rasta-commerce-deliverables
          path: release/*.zip
          if-no-files-found: error
