version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      quality-tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Major QA-tool upgrades can change lint rules or runtime requirements.
      # They are reviewed deliberately after a compatibility branch is tested.
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
